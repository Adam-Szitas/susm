<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SUSM | Project workspace</title>
    <meta
      name="description"
      content="Keep project objects, site photos, checklists, and PDF protocols connected in one workspace with SUSM."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="SUSM | Project workspace" />
    <meta
      property="og:description"
      content="Project documentation, photos, checklists and PDF protocols in one workspace."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://susm.vercel.app/social/susm-preview.png" />
    <meta property="og:image:alt" content="SUSM project documentation workspace" />
    <meta name="twitter:card" content="summary_large_image" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#9d0000" />
    <link rel="icon" type="image/svg+xml" href="susm.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isLocalDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          if (isLocalDev) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.forEach((reg) => reg.unregister());
            });
            return;
          }
          navigator.serviceWorker
            .register('/service-worker.js')
            .then((registration) => {
              console.log('ServiceWorker registration successful:', registration.scope);
            })
            .catch((error) => {
              console.log('ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
