<p class="confirm-message">{{ message }}</p>
<div class="confirm-actions">
  <button
    type="button"
    class="button button-secondary"
    (click)="handleCancel()"
    (touchend)="onCancelTouch()"
  >
    {{ cancelText }}
  </button>
  <button
    type="button"
    [class]="confirmKind === 'danger' ? 'button button-danger' : 'button button-primary'"
    (click)="handleConfirm()"
    (touchend)="onConfirmTouch()"
  >
    {{ confirmText }}
  </button>
</div>
