<p class="confirm-message">{{ message }}</p>
<div class="confirm-actions">
  <button
    type="button"
    class="button button-secondary"
    (click)="handleCancel()"
    (touchend)="onCancelTouch()"
    [attr.aria-label]="cancelText"
    [title]="cancelText"
  >
    <app-icon [icon]="icons.close" [size]="20" />
    <span class="action-label">{{ cancelText }}</span>
  </button>
  <button
    type="button"
    [class]="confirmKind === 'danger' ? 'button button-danger' : 'button button-primary'"
    (click)="handleConfirm()"
    (touchend)="onConfirmTouch()"
    [attr.aria-label]="confirmText"
    [title]="confirmText"
  >
    <app-icon [icon]="confirmKind === 'danger' ? icons.trash : icons.check" [size]="20" />
    <span class="action-label">{{ confirmText }}</span>
  </button>
</div>
