<app-page-header [title]="'objects.title' | translate" [balanceLeading]="true">
  <button
    pageHeaderLeading
    type="button"
    class="button button-secondary objects-filter-toggle objects-filter-toggle--icon-only"
    (click)="toggleFilters()"
    [attr.aria-expanded]="filtersVisible()"
    [attr.aria-label]="
      filtersVisible() ? ('filter.hide' | translate) : ('filter.show' | translate)
    "
    [attr.title]="filtersVisible() ? ('filter.hide' | translate) : ('filter.show' | translate)"
    aria-controls="filterControls"
  >
    @if (filtersVisible()) {
      <app-icon [icon]="icons.filterOff" svgClass="objects-filter-toggle-icon" />
    } @else {
      <app-icon [icon]="icons.filter" svgClass="objects-filter-toggle-icon" />
    }
  </button>
</app-page-header>

<div class="objects-wrapper">
  <app-filter
    [filter]="filterData()"
    [initialState]="restoredFilterState()"
    [hideToggleButton]="true"
    (filterChange)="onFilterChange($event)"
    (filtersVisibleChange)="onFiltersVisibleChange($event)"
  ></app-filter>

  @if (filteredObjects().length > 0) {
    <app-virtual-scroll-viewport
      class="objects-list-viewport"
      [items]="filteredObjects()"
      [itemSize]="objectCardItemSize"
      [threshold]="virtualScrollThreshold"
      [trackBy]="trackObjectItemById"
      [ariaLabel]="'objects.title' | translate"
      [gridLayout]="true"
      [fill]="true"
    >
      <ng-template let-item>
        @if (item.object; as objectItem) {
          @let objectId = objectItem._id?.$oid;
          <app-object-card
            [object]="objectItem"
            [projectName]="item.project_name"
            [routerLink]="objectId ? '/objects/tab/' + objectId : null"
            [showStatus]="true"
            [includePostalCode]="true"
            dateFormat="datetime"
          />
        }
      </ng-template>
    </app-virtual-scroll-viewport>
  } @else {
    <p class="empty-state">{{ 'protocols.noObjectsAvailable' | translate }}</p>
  }
</div>
