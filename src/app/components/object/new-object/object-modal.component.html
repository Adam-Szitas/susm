<div class="object-bulk-form">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="object-fields">
      <div class="control">
        <label for="prefix">{{ 'objects.prefix' | translate }}</label>
        <input
          id="prefix"
          type="text"
          formControlName="prefix"
          [placeholder]="'objects.prefixPlaceholder' | translate"
        />
      </div>
      <div class="control">
        <label for="rangeStart">{{ 'objects.rangeStart' | translate }}</label>
        <input
          id="rangeStart"
          type="number"
          step="1"
          formControlName="rangeStart"
          [placeholder]="'objects.rangeStartPlaceholder' | translate"
          required
        />
      </div>
      <div class="control">
        <label for="rangeEnd">{{ 'objects.rangeEnd' | translate }}</label>
        <input
          id="rangeEnd"
          type="number"
          step="1"
          formControlName="rangeEnd"
          [placeholder]="'objects.rangeEndPlaceholder' | translate"
        />
      </div>
      <div class="control">
        <label for="status">{{ 'objects.status' | translate }}</label>
        <app-status-select id="status" formControlName="status" />
      </div>
    </div>
    <label class="skip-toggle">
      <input type="checkbox" role="switch" formControlName="skipExistingHouseNumbers" />
      <span class="toggle-track" aria-hidden="true"></span>
      <span>{{ 'objects.skipExistingHouseNumbers' | translate }}</span>
    </label>
    @let preview = getRangePreview();
    @if (
      form.get('rangeStart')?.value !== '' &&
      form.get('rangeStart')?.value !== null &&
      preview.errorKey
    ) {
      <p class="range-error" role="status">
        {{ preview.errorKey | translate: preview.errorParams }}
      </p>
    }
    <div class="form-actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || progressing() || !preview.valid"
      >
        @if (progressing()) {
          {{ 'common.saving' | translate }}
        } @else {
          {{ 'objects.createObjects' | translate: { count: preview.toCreate.length } }}
        }
      </button>
    </div>
  </form>
</div>
