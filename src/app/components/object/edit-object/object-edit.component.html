<div class="wrapper">
  @if (form) {
    <form [formGroup]="form">
      <app-object-form-fields [form]="form" />
      <div class="form-actions">
        @if (isAdmin()) {
          <button
            type="button"
            class="button button-error delete-action"
            (click)="deleteObject()"
            [disabled]="deleting() || progressing()"
            [attr.aria-label]="'objects.deleteObject' | translate"
            [title]="'objects.deleteObject' | translate"
          >
            <app-trash-icon [size]="20" />
          </button>
        }
        <button
          type="button"
          class="button button-primary submit-action"
          [disabled]="form.invalid || progressing() || deleting()"
          (click)="submit()"
          [attr.aria-label]="'common.submit' | translate"
          [title]="'common.submit' | translate"
        >
            <app-icon [icon]="icons.check" [svgClass]="'submit-icon'" [strokeWidth]="2.5" />
        </button>
      </div>
    </form>
  }
</div>
