<div class="wrapper">
  @if (form) {
    <form [formGroup]="form">
      <div class="control" formGroupName="address">
        <h4>{{ 'common.address' | translate }}</h4>
        <div class="control">
          <label for="house_number">{{ 'common.houseNumber' | translate }} *</label>
          <input
            placeholder="house number"
            type="text"
            id="house_number"
            formControlName="house_number"
          />
        </div>
        <div class="control">
          <label for="level">{{ 'common.level' | translate }}</label>
          <input placeholder="e.g. 3 or 3rd" type="text" id="level" formControlName="level" />
        </div>
        <div class="control">
          <label for="door_number">{{ 'common.doorNumber' | translate }}</label>
          <input
            placeholder="door or flat number"
            type="text"
            id="door_number"
            formControlName="door_number"
          />
        </div>
      </div>
      <div class="control">
        <label for="note">{{ 'common.note' | translate }}</label>
        <input placeholder="Note" type="text" id="note" formControlName="note" />
      </div>
      <div class="control">
        <label for="prefix">{{ 'objects.prefix' | translate }}</label>
        <input placeholder="{{ 'objects.prefixPlaceholder' | translate }}" type="text" id="prefix" formControlName="prefix" />
      </div>
      <div class="control">
        <label for="status">{{ 'objects.status' | translate }}</label>
        <select id="status" formControlName="status">
          @for (status of statuses; track status) {
            <option [value]="status">{{ statusLabel(status) | translate }}</option>
          }
        </select>
      </div>
      <div class="form-actions">
        @if (isAdmin()) {
          <button
            type="button"
            class="button button-error delete-action"
            [class.icon-only]="iconOnlyActions()"
            (click)="deleteObject()"
            [disabled]="deleting() || progressing()"
            [attr.aria-label]="'objects.deleteObject' | translate"
            [title]="'objects.deleteObject' | translate"
          >
            <app-trash-icon [size]="20" />
            @if (!iconOnlyActions()) {
              <span class="action-label">{{ 'objects.deleteObject' | translate }}</span>
            }
          </button>
        }
        <button
          type="button"
          class="button button-primary submit-action"
          [class.icon-only]="iconOnlyActions()"
          [disabled]="form.invalid || progressing() || deleting()"
          (click)="submit()"
          [attr.aria-label]="'common.submit' | translate"
          [title]="'common.submit' | translate"
        >
          @if (iconOnlyActions()) {
            <svg
              class="submit-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
          } @else {
            <span class="action-label">{{ 'common.submit' | translate }}</span>
          }
        </button>
      </div>
    </form>
  }
</div>
