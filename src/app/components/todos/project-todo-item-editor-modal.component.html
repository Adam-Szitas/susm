<form class="checklist-editor" [formGroup]="form" (submit)="$event.preventDefault(); save()">
  <div class="todo-item-fields">
    <label class="field">
      <span class="field-label">{{ 'todos.itemTitle' | translate }}</span>
      <input
        #titleInput
        type="text"
        formControlName="title"
        autocomplete="off"
        [placeholder]="'todos.itemTitle' | translate"
      />
    </label>
    <label class="field">
      <span class="field-label">{{ 'todos.itemNoteOptional' | translate }}</span>
      <textarea
        formControlName="note"
        rows="2"
        [placeholder]="'todos.itemNoteOptional' | translate"
      ></textarea>
    </label>
  </div>

  <div class="sub-items-section">
    <div class="sub-items-header">{{ 'todos.subItems' | translate }}</div>
    <div class="sub-items-list" formArrayName="subItems">
      @for (subControl of subItems.controls; track subControl; let subIdx = $index) {
        <div class="sub-item-row" [formGroupName]="subIdx">
          <input type="hidden" formControlName="id" />
          <input
            type="text"
            formControlName="title"
            [placeholder]="'todos.subItemTitle' | translate"
          />
          <div
            class="color-picker"
            role="group"
            [attr.aria-label]="'todos.subItemColor' | translate"
          >
            @for (color of colorOptions; track color) {
              <button
                type="button"
                class="color-swatch color-swatch--{{ color }}"
                [class.color-swatch--selected]="subControl.get('color')?.value === color"
                [attr.title]="colorLabel(color) | translate"
                [attr.aria-label]="colorLabel(color) | translate"
                [attr.aria-pressed]="subControl.get('color')?.value === color"
                (click)="setSubItemColor(subIdx, color)"
              ></button>
            }
          </div>
          <button
            type="button"
            class="button button-error action-button sub-item-delete"
            (click)="removeSubItem(subIdx)"
            [attr.aria-label]="'common.delete' | translate"
            [title]="'common.delete' | translate"
          >
            <app-trash-icon [size]="20" />
          </button>
        </div>
      }
    </div>
    <button
      type="button"
      class="btn btn-secondary add-sub-btn"
      (click)="addSubItem()"
      [disabled]="saving || confirmingDelete"
      [attr.aria-label]="'todos.addSubItem' | translate"
      [title]="'todos.addSubItem' | translate"
    >
      <app-icon [icon]="icons.plus" [size]="20" />
      <span class="action-label">{{ 'todos.addSubItem' | translate }}</span>
    </button>
  </div>

  <div class="form-actions">
    @if (todoItem()) {
      <button
        type="button"
        class="button button-error action-button checklist-delete-btn delete-action"
        [disabled]="saving || confirmingDelete"
        (click)="deleteChecklist()"
        [attr.aria-label]="'todos.deleteChecklist' | translate"
        [title]="'todos.deleteChecklist' | translate"
      >
        <app-trash-icon [size]="20" />
        <span class="action-label">{{ 'todos.deleteChecklist' | translate }}</span>
      </button>
    }
    <button
      type="button"
      class="button button-secondary action-button cancel-action"
      [disabled]="saving || confirmingDelete"
      (click)="close()"
      [attr.aria-label]="'common.cancel' | translate"
      [title]="'common.cancel' | translate"
    >
      <app-icon [icon]="icons.close" [strokeWidth]="2.5" />
      <span class="action-label">{{ 'common.cancel' | translate }}</span>
    </button>
    <button
      type="submit"
      class="button button-primary action-button submit-action"
      [disabled]="saving || confirmingDelete"
      [attr.aria-busy]="saving"
      [attr.aria-label]="(saving ? 'common.saving' : 'common.save') | translate"
      [title]="(saving ? 'common.saving' : 'common.save') | translate"
    >
      <app-icon [icon]="saving ? icons.loader : icons.check" [strokeWidth]="2.5" />
      <span class="action-label">{{ (saving ? 'common.saving' : 'common.save') | translate }}</span>
    </button>
  </div>
</form>
