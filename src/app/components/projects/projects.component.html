<app-page-header [title]="'projects.title' | translate" [balanceActions]="true">
  <button
    pageHeaderAction
    type="button"
    class="button button-secondary archive-toggle archive-toggle--icon-only"
    [class.archive-toggle--active]="showArchived()"
    [attr.aria-pressed]="showArchived()"
    [attr.aria-label]="
      showArchived()
        ? ('projects.hideArchived' | translate)
        : ('projects.showArchived' | translate)
    "
    [attr.title]="
      showArchived()
        ? ('projects.hideArchived' | translate)
        : ('projects.showArchived' | translate)
    "
    (click)="toggleArchived()"
  >
    <app-icon [icon]="icons.archive" svgClass="archive-toggle-icon" />
  </button>
</app-page-header>

<div class="projects-wrapper">
  @if (projects().length) {
    <app-virtual-scroll-viewport
      class="projects-list-viewport"
      [items]="projects()"
      [itemSize]="projectCardItemSize"
      [threshold]="virtualScrollThreshold"
      [trackBy]="trackProjectById"
      [maxHeight]="'min(65dvh, 720px)'"
      [ariaLabel]="'projects.title' | translate"
    >
      <ng-template let-project>
        <app-project-card [project]="project" [routerLink]="'tab/' + project._id?.$oid" />
      </ng-template>
    </app-virtual-scroll-viewport>
  } @else {
    <p class="empty-state">{{ 'projects.noProjects' | translate }}</p>
  }

  <app-floating-add-button
    [ariaLabel]="'projects.addNew' | translate"
    (clicked)="newProject()"
  />
</div>
