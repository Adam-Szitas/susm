<div class="wrapper">
  @if (form) {
    <form [formGroup]="form">
      <app-project-form-fields [form]="form" />
      <div class="control buttons">
        <button
          type="button"
          class="button button-success"
          [disabled]="form.invalid || progressing()"
          (click)="Submit()"
        >
          {{ 'common.submit' | translate }}
        </button>
      </div>
    </form>
  }
</div>
