<div class="move-file-modal">
  <ul class="move-file-modal-list">
    @for (row of targetRows(); track row.groupId) {
      <li>
        <button type="button" class="move-file-modal-option" (click)="pick(row.groupId)">
          {{ row.label }}
        </button>
      </li>
    }
  </ul>
  <div class="move-file-modal-actions">
    <button type="button" class="button button-secondary move-file-modal-cancel" (click)="cancel()">
      {{ 'common.cancel' | translate }}
    </button>
  </div>
</div>
