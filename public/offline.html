<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUSM - Offline workspace</title>
<style>
*{box-sizing:border-box}body{font:1rem/1.55 system-ui,sans-serif;margin:auto;padding:1.25rem;max-width:40rem;color:#272121}h1{line-height:1.15}button,select,textarea{font:inherit;padding:.65rem;max-width:100%}textarea,select{display:block;width:100%;margin:.5rem 0}button{color:#fff;background:#850000;border:0;border-radius:.45rem}label{display:block;margin-top:1rem}textarea{min-height:12rem}
</style><main><h1>SUSM offline workspace</h1><p>Project data is unavailable. You can edit checklist drafts saved on this device.</p>
<button id="retry">Reconnect to SUSM</button>
<section id="drafts" hidden><label>Project<select id="projects"></select></label><label>Checklist note<textarea id="note"></textarea></label></section>
<p role="status" id="status"></p></main><script src="/offline.js" defer></script></html>
